# Huellitas — producción (Compose centralizado)
#
# Ubicación: veterinarian-backend/deploy/
# Dominios públicos (solo host Nginx 80/443; este archivo NO configura el host):
#   Frontend: https://huellitas.chatcampuslands.com
#   API:      https://api.huellitas.chatcampuslands.com
#
# Publicación al host (solo loopback para reverse proxy):
#   frontend → 127.0.0.1:5181 → contenedor :80
#   backend  → 127.0.0.1:5233 → contenedor :8080
# Internos (sin publish): chatbot:8010, redis:6379, qdrant:6333/6334, oracle:1521
#
# Secretos: env_file en VPS (copiar desde cada .env.example). No versionar .env reales.
# Validación sin secretos (desde carpeta padre Huellitas o desde este directorio):
#   docker compose -f veterinarian-backend/deploy/docker-compose.prod.yml config
# Guía: DEPLOY.md (este directorio)

name: huellitas

services:
  frontend:
    build:
      context: ../../veterinarian-fronted
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.huellitas.chatcampuslands.com
    image: huellitas-frontend:prod
    container_name: huellitas_frontend
    ports:
      - "127.0.0.1:5181:80"
    depends_on:
      - backend
    networks:
      - huellitas_network
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: huellitas-backend:prod
    container_name: huellitas_backend
    ports:
      - "127.0.0.1:5233:8080"
    env_file:
      - path: ../.env
        required: false
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      Agent__BaseUrl: http://chatbot:8010
    depends_on:
      oracle:
        condition: service_healthy
    networks:
      - huellitas_network
    restart: unless-stopped

  chatbot:
    build:
      context: ../../Huellitas_ChatBot
      dockerfile: Dockerfile
      target: runtime
    image: huellitas-chatbot:prod
    container_name: huellitas_chatbot
    env_file:
      - path: ../../Huellitas_ChatBot/.env
        required: false
    environment:
      HUELLITAS_HOST: "0.0.0.0"
      HUELLITAS_PORT: "8010"
      HUELLITAS_BACKEND_ENABLED: "true"
      HUELLITAS_BACKEND_BASE_URL: "http://backend:8080"
      HUELLITAS_REDIS_ENABLED: "true"
      HUELLITAS_REDIS_URL: "redis://redis:6379"
      HUELLITAS_VECTOR_STORE_ENABLED: "true"
      HUELLITAS_QDRANT_URL: "http://qdrant:6333"
      HUELLITAS_CHECKPOINT_PROVIDER: "redis"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - huellitas_network
    restart: unless-stopped

  redis:
    image: redis:8.8.2-alpine
    container_name: huellitas_redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - huellitas_redis_data:/data
    networks:
      - huellitas_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: huellitas_qdrant
    volumes:
      - huellitas_qdrant_data:/qdrant/storage
    networks:
      - huellitas_network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: huellitas_oracle
    env_file:
      - path: ../.env
        required: false
    volumes:
      - huellitas_oracle_data:/opt/oracle/oradata
    networks:
      - huellitas_network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

networks:
  huellitas_network:
    name: huellitas_network
    driver: bridge

volumes:
  huellitas_oracle_data:
    name: huellitas_oracle_data
  huellitas_redis_data:
    name: huellitas_redis_data
  huellitas_qdrant_data:
    name: huellitas_qdrant_data
